[package]
name = "rie-ai"
version = "0.6.7"
description = "Rie-AI desktop assistant"
authors = ["you"]
edition = "2021"
default-run = "Rie-AI"

[[bin]]
name = "Rie-AI"
path = "src/main.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "rie_ai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
tauri-plugin-shell = "2.3.3"
tauri-plugin-updater = "2.9.0"
tauri-plugin-single-instance = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-autostart = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-clipboard-manager = "2.2.0"
tauri-plugin-notification = "2"
cpal = "0.15"
hound = "3.5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Devices_Geolocation",
    "Foundation",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_Com",
] }
uiautomation = { version = "0.25.0", features = ["all"] }

[profile.release]
opt-level = 3       # Optimizes for execution speed, compiles faster than size-optimized 's' or 'z'
lto = "thin"        # 'thin' LTO compiles much faster than standard 'fat' LTO
codegen-units = 16  # Runs code generation in parallel using all runner cores
panic = "abort"     # Cuts unwinding overhead, reducing binary size & compile time
incremental = false # Disabled for CI release builds to speed up link time and reduce disk I/O

