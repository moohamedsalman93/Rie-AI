name: Build and Release Tauri App

on:
  push:
    tags:
      - 'v*' # Triggers release workflow only when you push a version tag like v0.5.6

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Restore cached Python Sidecar Executable (checks cache first)
      - name: Cache Python Sidecar Binary
        id: sidecar-cache
        uses: actions/cache@v4
        with:
          path: client/src-tauri/bin/rie-backend-x86_64-pc-windows-msvc.exe
          key: ${{ runner.os }}-sidecar-${{ hashFiles('server/**/*.py', 'server/poetry.lock', 'server/rie-backend.spec', 'update-backend.ps1') }}

      # 2. Python Environment & Sidecar Build (ONLY if sidecar cache misses)
      - name: Set up Python
        if: steps.sidecar-cache.outputs.cache-hit != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        if: steps.sidecar-cache.outputs.cache-hit != 'true'
        run: |
          pipx install poetry
          poetry config virtualenvs.create true
          poetry config virtualenvs.in-project true

      - name: Cache Poetry Virtualenv
        if: steps.sidecar-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: server/.venv
          key: ${{ runner.os }}-poetry-${{ hashFiles('server/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install Python Dependencies
        if: steps.sidecar-cache.outputs.cache-hit != 'true'
        working-directory: ./server
        run: |
          poetry install --no-root

      - name: Build Python Sidecar (PyInstaller)
        if: steps.sidecar-cache.outputs.cache-hit != 'true'
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File ./update-backend.ps1

      # 3. Setup Node.js & dependencies with cache
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Node Dependencies
        working-directory: ./client
        run: |
          npm ci

      # 4. Setup Rust for Tauri compiler
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Cache compiled Rust artifacts across tag releases
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'client/src-tauri -> target'
          shared-key: 'tauri-release'
          add-job-id-key: false
          cache-all-crates: true
          cache-on-failure: true

      # 5. Build Tauri App and Auto-Publish Release Assets
      - name: Build and Publish Tauri Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'v__VERSION__ - Release'
          releaseBody: |
            ## Rie-AI ${{ github.ref_name }}

            ### Installation
            Download and run the NSIS installer (.exe) for Windows.

            ### Features
            - AI Chat Interface
            - Over-The-Air (OTA) updates enabled
          releaseDraft: false
          prerelease: false
          projectPath: './client'


