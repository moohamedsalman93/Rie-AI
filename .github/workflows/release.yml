name: Build and Release Tauri App

on:
  push:
    branches:
      - main
    tags:
      - 'v*' # Triggers full release workflow when you push a version tag like v0.3.5
    paths:
      # Only relevant for the `main` branch trigger — warms the Rust cache
      # when Rust-affecting files change. Tag pushes always run regardless
      # of paths-filter (GitHub ignores `paths` for tag-ref events).
      - 'client/src-tauri/**'
      - 'client/src-tauri/Cargo.lock'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Setup Python & Poetry
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: |
          pipx install poetry
          poetry config virtualenvs.create true
          poetry config virtualenvs.in-project true

      # 2. Cache Poetry Dependencies
      - name: Cache Poetry Virtualenv
        uses: actions/cache@v4
        with:
          path: server/.venv
          key: ${{ runner.os }}-poetry-${{ hashFiles('server/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install Python Dependencies
        working-directory: ./server
        run: |
          poetry install --no-root

      # 3. Cache PyInstaller (bootloader + build analysis cache)
      - name: Cache PyInstaller
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.LOCALAPPDATA }}/pyinstaller
            server/build
          key: ${{ runner.os }}-pyinstaller-${{ hashFiles('server/rie-backend.spec', 'server/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-pyinstaller-

      # 4. Build Python Sidecar (PyInstaller)
      - name: Build Python Sidecar (PyInstaller)
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File ./update-backend.ps1

      # 5. Setup Node.js & dependencies with cache
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Node Dependencies
        working-directory: ./client
        run: |
          npm ci

      # 6. Setup Rust for Tauri compiler
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Cache compiled Rust artifacts. shared-key keeps the key stable across
      # both tag releases and cache-warm runs on main, so tag builds can
      # restore what main already compiled.
      # add-job-id-key MUST be false — the default (true) makes every job's
      # cache key unique, which defeats cross-run/cross-job cache reuse.
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'client/src-tauri -> target'
          shared-key: 'tauri-release'
          add-job-id-key: false
          cache-all-crates: true
          cache-on-failure: true

      # 7. Build Tauri App and Auto-Publish Release Assets
      #    Only runs on tag pushes — this is the actual release step.
      - name: Build and Publish Tauri Application
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'v__VERSION__ - Release'
          releaseBody: |
            ## Rie-AI ${{ github.ref_name }}

            ### Installation
            Download and run the NSIS installer (.exe) for Windows.

            ### Features
            - AI Chat Interface
            - Over-The-Air (OTA) updates enabled
          releaseDraft: false
          prerelease: false
          projectPath: './client'

      # 7b. On main pushes (cache-warm only): compile Rust in release mode
      #     without bundling. This populates target/ under the shared cache
      #     key on refs/heads/main, so the next tag release restores a warm
      #     cache instead of building cold.
      - name: Warm Rust build cache (main only)
        if: github.ref == 'refs/heads/main'
        working-directory: ./client/src-tauri
        run: cargo build --release
