name: Build and Release Tauri App

on:
  push:
    tags:
      - 'v*' # Triggers workflow when you push a version tag like v0.3.5

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Setup Python & Poetry
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: |
          pipx install poetry
          poetry config virtualenvs.create true
          poetry config virtualenvs.in-project true

      # 2. Cache Poetry Dependencies
      - name: Cache Poetry Virtualenv
        uses: actions/cache@v4
        with:
          path: server/.venv
          key: ${{ runner.os }}-poetry-${{ hashFiles('server/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install Python Dependencies
        working-directory: ./server
        run: |
          poetry install --no-root

      # 3. Cache PyInstaller
      - name: Cache PyInstaller
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pyinstaller
          key: ${{ runner.os }}-pyinstaller-${{ hashFiles('server/rie-backend.spec') }}
          restore-keys: |
            ${{ runner.os }}-pyinstaller-

      # 4. Build Python Sidecar (PyInstaller)
      - name: Build Python Sidecar (PyInstaller)
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File ./update-backend.ps1

      # 5. Setup Node.js & dependencies with cache
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Node Dependencies
        working-directory: ./client
        run: |
          npm ci

      # 6. Setup Rust for Tauri compiler
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './client/src-tauri -> target'

      # 7. Build Tauri App and Auto-Publish Release Assets
      - name: Build and Publish Tauri Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'v__VERSION__ - Release'
          releaseBody: |
            ## Rie-AI ${{ github.ref_name }}
            
            ### Installation
            Download and run the MSI/EXE installer for Windows.
            
            ### Features
            - AI Chat Interface
            - Over-The-Air (OTA) updates enabled
          releaseDraft: false
          prerelease: false
          projectPath: './client'
